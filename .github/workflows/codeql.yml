name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '10.0.x'

      # Commit-pinned official action; the comment records the moving major used for updates.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # NOTE (#91): the local model pack CANNOT be wired through the `config`
          # input of this action — with the pinned action and CodeQL CLI 2.27.1 the
          # `packs:` entries never reach the database's recorded extensionPacks, so
          # the pack is silently ignored by the analysis. The pack is applied at
          # query time in the Analyze C# step below, using the same
          # --additional-packs/--extension-packs mechanism the action itself uses
          # for its pr-diff-range pack.

      - name: Build C#
        if: matrix.language == 'csharp'
        run: dotnet build backend/Ruoyu.Admin.sln --configuration Release

      # Local model pack (#91): declares AdminLogValue.Sanitize as a log-injection
      # barrier. Direct CLI invocation because the pinned analyze action exposes no
      # model-pack input; the pack is resolved from the checkout with
      # --additional-packs and applied with --extension-packs (pack name and version
      # must match .github/codeql/log-models/qlpack.yml). setup-codeql puts the CLI
      # (already downloaded by init) on PATH for these steps.
      - uses: github/codeql-action/setup-codeql@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: matrix.language == 'csharp'

      - name: Analyze C#
        if: matrix.language == 'csharp'
        env:
          DB: ${{ runner.temp }}/codeql_databases/csharp
        run: |
          codeql database finalize --finalize-dataset "$DB"
          codeql database run-queries "$DB" \
            --additional-packs="$GITHUB_WORKSPACE/.github/codeql/log-models" \
            --extension-packs=ruoyu-admin/log-sanitizer-models@0.1.0
          codeql database interpret-results "$DB" \
            --format=sarif-latest \
            --output="$RUNNER_TEMP/csharp.sarif" \
            --sarif-category=/language:csharp

      - name: Upload C# results
        if: matrix.language == 'csharp'
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: ${{ runner.temp }}/csharp.sarif
          category: /language:csharp

      - name: Analyze
        if: matrix.language != 'csharp'
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:${{ matrix.language }}
