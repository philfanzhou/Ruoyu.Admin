name: CI

# This public-repository workflow only builds and tests on GitHub-hosted runners,
# and publishes container images on release tags. Deployment is intentionally
# separate; do not add a job that would let pull-request code run on deployment
# infrastructure.

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Both Dockerfiles default NPM_REGISTRY to a mirror that is fast from the
  # maintainer's network; GitHub-hosted runners use the official registry instead.
  NPM_REGISTRY: https://registry.npmjs.org/

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # There is deliberately no global.json in this repository; the SDK floor is
      # the sdk:8.0 stage in the Dockerfile, so CI pins the same major line.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same commands as the AGENTS.md verification section, in the same order.
      - name: Backend build & test
        working-directory: backend
        run: |
          dotnet restore Ruoyu.Admin.sln
          dotnet build Ruoyu.Admin.sln --configuration Release --no-restore
          dotnet test Ruoyu.Admin.sln --configuration Release --no-build

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Building both images on every push keeps the Dockerfiles honest even when
      # only backend or only frontend code changed; each image embeds both sides
      # (the unified API image bakes the SPA into wwwroot).
      - name: Build unified API image
        run: |
          docker build -f backend/Admin.WebApi/Dockerfile \
            --build-arg NPM_REGISTRY="$NPM_REGISTRY" \
            -t ruoyu.admin:ci .

      - name: Build standalone web image
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg NPM_REGISTRY="$NPM_REGISTRY" \
            -t ruoyu.admin.web:ci .

      # Report-only for now (exit-code 0), unlike SignaCore's blocking scan.
      # Reason: the API image embeds Steeltoe.Discovery.Consul 4.2.0, whose known
      # high-severity advisory GHSA-67c9-f6v2-qv86 (DoS via malformed 'secure'
      # metadata) is patched in 4.3.0, so --ignore-unfixed will not skip it and a
      # blocking scan would fail every pull request from day one. The bump is a
      # dependency change with its own verification surface (Consul KV loading)
      # and must not ride along with CI infrastructure. Promote both steps to
      # exit-code 1 in the change that bumps Steeltoe to >= 4.3.0, after
      # re-evaluating whatever else these first scans surface.
      # Pin the action commit because scanner distribution channels are part of
      # the threat model.
      - name: Scan API image for high and critical vulnerabilities (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ruoyu.admin:ci
          version: v0.73.0
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan web image for high and critical vulnerabilities (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ruoyu.admin.web:ci
          version: v0.73.0
          skip-setup-trivy: true
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

  # Tag pushes only. MAJOR.MINOR.PATCH publishes the stable images and moves the
  # minor channel and latest; MAJOR.MINOR.PATCH-rc.N publishes a test image under
  # its exact immutable version tag and never touches a production tag.
  publish-images:
    name: Publish GHCR Images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/philfanzhou/ruoyu.admin
      WEB_IMAGE: ghcr.io/philfanzhou/ruoyu.admin.web
    outputs:
      api-digest: ${{ steps.push-api.outputs.digest }}
      web-digest: ${{ steps.push-web.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Release tag must use MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-rc.NUMBER." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `flavor: latest=false` keeps the explicit gated row below as the only
      # source of `latest`, so the action's automatic latest never leaks onto an
      # rc build. Release tags carry no `v` prefix, same convention as SignaCore.
      - name: Generate API image metadata
        id: meta-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.API_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Generate web image metadata
        id: meta-web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.WEB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and publish API image
        id: push-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Admin.WebApi/Dockerfile
          build-args: NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=ruoyu-admin-api
          cache-to: type=gha,mode=max,scope=ruoyu-admin-api
          provenance: mode=max
          sbom: true

      - name: Build and publish web image
        id: push-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          build-args: NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=ruoyu-admin-web
          cache-to: type=gha,mode=max,scope=ruoyu-admin-web
          provenance: mode=max
          sbom: true

      - name: Record published images
        env:
          META_TAGS: |
            ${{ steps.meta-api.outputs.tags }}
            ${{ steps.meta-web.outputs.tags }}
        run: |
          {
            echo "### Published containers"
            echo
            echo "- API digest: \`${{ steps.push-api.outputs.digest }}\`"
            echo "- Web digest: \`${{ steps.push-web.outputs.digest }}\`"
            echo "- Tags:"
            # `continue` rather than a trailing `&&`: the last command of the loop
            # body sets the status of the loop, the group, and the step, so a blank
            # final line would fail the step after the images are already pushed.
            while IFS= read -r image_tag; do
              [ -n "$image_tag" ] || continue
              printf '  - `%s`\n' "$image_tag"
            done <<< "${META_TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs last so a release only ever exists for a tag whose images are actually
  # pullable, and so the notes can quote the digests that were really published.
  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      API_IMAGE: ghcr.io/philfanzhou/ruoyu.admin
      WEB_IMAGE: ghcr.io/philfanzhou/ruoyu.admin.web
      API_DIGEST: ${{ needs.publish-images.outputs.api-digest }}
      WEB_DIGEST: ${{ needs.publish-images.outputs.web-digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail

          # Re-running the workflow for a tag must not rewrite notes someone has
          # since edited by hand, so an existing release is left exactly as it is.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it untouched."
            echo "Release \`${GITHUB_REF_NAME}\` already existed and was left untouched." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags=(--prerelease)
            channel_note="Pre-release (test) images; the stable minor channel and latest tags were not moved."
          else
            minor="${GITHUB_REF_NAME%.*}"
            release_flags=(--latest)
            channel_note="Also tagged ${minor} and latest."
          fi

          # printf keeps the Markdown backticks literal; a heredoc would need them escaped.
          {
            printf '## Container images\n\n'
            printf '```\n%s:%s\n%s:%s\n```\n\n' \
              "${API_IMAGE}" "${GITHUB_REF_NAME}" \
              "${WEB_IMAGE}" "${GITHUB_REF_NAME}"
            printf 'Digests: API `%s`, web `%s`\n\n' "${API_DIGEST}" "${WEB_DIGEST}"
            printf '%s\n' "${channel_note}"
          } > release-notes.md

          # --generate-notes appends GitHub's commit and pull-request changelog underneath.
          gh release create "${GITHUB_REF_NAME}" \
            --title "Ruoyu.Admin ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag \
            "${release_flags[@]}"

          {
            echo "### Published release"
            echo
            echo "- <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}>"
          } >> "$GITHUB_STEP_SUMMARY"
