<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Prototype Hub - 界面原型导航</title>
  <style>
    :root {
      --el-color-primary: #409eff;
      --el-color-success: #67c23a;
      --el-color-warning: #e6a23c;
      --el-color-danger: #f56c6c;
      --el-color-info: #909399;
      --el-text-color-primary: #303133;
      --el-text-color-regular: #606266;
      --el-text-color-secondary: #909399;
      --shadow-light: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-card: 0 2px 12px 0 rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f0f2f5;
      color: var(--el-text-color-primary);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    .app-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* Header */
    .hero {
      text-align: center;
      margin-bottom: 40px;
      padding: 40px 20px;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      box-shadow: var(--shadow-light);
    }

    .hero-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 14px;
      color: #ffffff;
      margin-bottom: 16px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.3px;
    }

    .hero-sub {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Prototype Grid */
    .prototype-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .prototype-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      box-shadow: var(--shadow-light);
      overflow: hidden;
      transition: all 0.2s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .prototype-card:hover {
      box-shadow: var(--shadow-card);
      border-color: #c7d2fe;
      transform: translateY(-2px);
    }

    .card-preview {
      height: 160px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #f3f4f6;
      position: relative;
      overflow: hidden;
    }

    .card-preview::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(59,130,246,0.04) 0%, rgba(37,99,235,0.06) 100%);
    }

    .preview-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      position: relative;
      z-index: 1;
    }

    .card-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 16px;
      flex: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      padding: 0 8px;
      height: 22px;
      border-radius: 4px;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #dbeafe;
      font-weight: 500;
    }

    .arrow {
      color: #9ca3af;
      transition: color 0.2s;
    }

    .prototype-card:hover .arrow {
      color: #2563eb;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
      color: #9ca3af;
      font-size: 12.5px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .app-shell { padding: 20px 16px; }
      .hero { padding: 28px 16px; }
      .hero h1 { font-size: 20px; }
      .prototype-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Header -->
    <header class="hero">
      <div class="hero-icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
      </div>
      <h1>UI Prototype Hub</h1>
      <p class="hero-sub">Student Management Console 界面原型集合，点击下方卡片查看各场景设计</p>
    </header>

    <!-- Prototype Grid -->
    <div class="prototype-grid">
      <!-- Main Page -->
      <a href="./main.html" class="prototype-card">
        <div class="card-preview">
          <div class="preview-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
        </div>
        <div class="card-body">
          <div class="card-title">Main Page - 主界面</div>
          <div class="card-desc">学生管理主界面，包含左侧创建学生表单和右侧学生列表。展示连接面板、搜索筛选、分页和 Actions 操作列。</div>
          <div class="card-meta">
            <span class="tag">Primary</span>
            <span class="arrow">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
            </span>
          </div>
        </div>
      </a>

      <!-- Edit Dialog -->
      <a href="./edit-dialog.html" class="prototype-card">
        <div class="card-preview">
          <div class="preview-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </div>
        </div>
        <div class="card-body">
          <div class="card-title">Edit Dialog - 编辑弹窗</div>
          <div class="card-desc">编辑学生信息弹窗，包含基础信息、关联 Identity 账户搜索与绑定、开放学科选择与有效期设置。</div>
          <div class="card-meta">
            <span class="tag">Dialog</span>
            <span class="arrow">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
            </span>
          </div>
        </div>
      </a>
    </div>

    <!-- Footer -->
    <footer class="footer">
      Student Management Console UI Prototypes &middot; Built for design review
    </footer>
  </div>
</body>
</html>
